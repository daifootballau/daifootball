<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BSP Match Stats Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#111;--mute:#6b6b6b;--line:#e2e2de;--or:#F28500;--gr:#9a9a98;--hd:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0c;--card:#181818;--ink:#f3f3f1;--mute:#a0a0a0;--line:#2c2c2c;--gr:#8a8a88;--hd:#000}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Barlow,system-ui,sans-serif}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0}
header{background:var(--hd);color:#fff;padding:22px 20px 18px;border-bottom:5px solid var(--or)}
header h1{font-size:34px;letter-spacing:.5px}header p{margin:2px 0 0;color:#bbb}
main{max-width:1100px;margin:0 auto;padding:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.filters button{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:7px 14px;font:600 14px Barlow,sans-serif;border-radius:3px;cursor:pointer}
.filters button.on{background:var(--or);border-color:var(--or);color:#000}
.filters .sp{width:14px}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
h2{font-size:24px;margin:26px 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);padding:14px 16px;border-radius:4px}
.kpi .l{color:var(--mute);font-weight:600;font-size:13px}
.kpi .v{display:flex;align-items:baseline;gap:10px}
.kpi .num{font-size:44px;line-height:1.05;color:var(--ink);border-bottom:4px solid var(--or);display:inline-block}
.kpi .a{font:600 20px "Barlow Condensed",sans-serif;color:var(--mute)}
.kpi .s{font-size:12px;color:var(--mute)}
.hero{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:4px}
.bar{display:flex;height:46px;border-radius:3px;overflow:hidden;margin:8px 0 6px;font:700 24px "Barlow Condensed",sans-serif}
.bar div{display:flex;align-items:center;padding:0 12px;white-space:nowrap}
.bar .b{background:var(--or);color:#000}.bar .w{background:var(--gr);color:#000;justify-content:flex-end}
.legend{display:flex;justify-content:space-between;color:var(--mute);font-weight:600;font-size:13px}
.charts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.charts .card h3{margin:0 0 8px;font:600 15px Barlow,sans-serif}
.cv{position:relative;height:250px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:760px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#000;color:#fff;font-weight:600;cursor:pointer;position:sticky;top:0}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
tr.bsp td:nth-child(2){color:var(--or);font-weight:700}
.notes{color:var(--mute);font-size:13px;margin:26px 0 10px}.notes li{margin:4px 0}
.up{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--or);padding:12px 14px;border-radius:4px;margin-bottom:14px}
.up div{flex:1 1 260px;display:flex;flex-direction:column}.up span{color:var(--mute);font-size:13px}
.btn{background:var(--or);color:#000;font:600 14px Barlow,sans-serif;padding:9px 16px;border-radius:3px;cursor:pointer;border:0}
.btn2{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style></head><body>
<header><h1>BSP Match Stats</h1><p id="sub"></p></header>
<main>
<section class="up"><div><strong>Update the report</strong><span id="upmsg">Upload a match CSV with the same columns to refresh every chart.</span></div><label class="btn" id="lbl" tabindex="0">Upload CSV<input type="file" id="file" accept=".csv,text/csv" hidden></label><button class="btn btn2" id="reset">Reset to sample</button></section>
<div class="filters" id="fm"></div>
<div class="filters" id="fh"></div>
<h2>Possession</h2>
<div class="hero"><div class="bar" id="pbar"></div><div class="legend"><span>BSP</span><span>Away Team</span></div></div>
<h2>Key numbers</h2><div class="grid" id="kpis"></div>
<h2>Match breakdown</h2>
<div class="charts">
<div class="card"><h3>Possession by match and half (%)</h3><div class="cv"><canvas id="c1"></canvas></div></div>
<div class="card"><h3>Shooting</h3><div class="cv"><canvas id="c2"></canvas></div></div>
<div class="card"><h3>Passing</h3><div class="cv"><canvas id="c3"></canvas></div></div>
<div class="card"><h3>Chances created by half</h3><div class="cv"><canvas id="c4"></canvas></div></div>
</div>
<h2>Full summary</h2><div class="tw"><table id="tb"></table></div>
<ul class="notes" id="notes"></ul>
</main>
<script>
let D={"matches": ["Match A", "Match B", "Match C"], "rows": [{"m": "Match A", "t": "Away Team", "h": "1ST HALF", "g": 0, "son": 0, "soff": 0, "pf": 12, "ps": 16, "ch": 0, "bp": 135.01}, {"m": "Match A", "t": "Away Team", "h": "2ND HALF", "g": 3, "son": 3, "soff": 3, "pf": 1, "ps": 8, "ch": 0, "bp": 166.22}, {"m": "Match A", "t": "BSP", "h": "1ST HALF", "g": 0, "son": 0, "soff": 1, "pf": 17, "ps": 12, "ch": 2, "bp": 209.06}, {"m": "Match A", "t": "BSP", "h": "2ND HALF", "g": 7, "son": 7, "soff": 8, "pf": 4, "ps": 14, "ch": 1, "bp": 218.41}, {"m": "Match B", "t": "Away Team", "h": "1ST HALF", "g": 0, "son": 0, "soff": 0, "pf": 12, "ps": 16, "ch": 0, "bp": 135.01}, {"m": "Match B", "t": "Away Team", "h": "2ND HALF", "g": 3, "son": 3, "soff": 3, "pf": 1, "ps": 8, "ch": 0, "bp": 166.22}, {"m": "Match B", "t": "BSP", "h": "1ST HALF", "g": 0, "son": 0, "soff": 1, "pf": 17, "ps": 12, "ch": 2, "bp": 209.06}, {"m": "Match B", "t": "BSP", "h": "2ND HALF", "g": 7, "son": 7, "soff": 8, "pf": 4, "ps": 14, "ch": 1, "bp": 218.41}, {"m": "Match C", "t": "Away Team", "h": "1ST HALF", "g": 0, "son": 0, "soff": 0, "pf": 14, "ps": 14, "ch": 0, "bp": 135.01}, {"m": "Match C", "t": "Away Team", "h": "2ND HALF", "g": 3, "son": 3, "soff": 3, "pf": 2, "ps": 4, "ch": 0, "bp": 166.22}, {"m": "Match C", "t": "BSP", "h": "1ST HALF", "g": 0, "son": 0, "soff": 1, "pf": 12, "ps": 18, "ch": 2, "bp": 209.06}, {"m": "Match C", "t": "BSP", "h": "2ND HALF", "g": 7, "son": 7, "soff": 8, "pf": 8, "ps": 16, "ch": 1, "bp": 218.41}], "notes": ["Possession % uses Home BP and Away BP durations only (other rows overlap them). The two teams total 100%.", "Kick-off rows have no team assigned and are excluded (6 rows, 4 passes counted in the raw file).", "Shot conversion is goals \u00f7 (shots on target + shots off target); chances created % is chances created \u00f7 goals. Both show n/a when the denominator is 0. All percentages are rounded to whole numbers.", "Data flags: Matches A, B and C are near-identical (possibly test data). Goals equal shots on target in every row, which may be a tagging overlap worth checking. The Away Team has no goals, so its chances created % shows n/a."]};const OR="#F28500";
let M="All",H="All",sortK=null,asc=true,charts={};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const GR=()=>css("--gr");
const sum=(rows,k)=>rows.reduce((s,r)=>s+r[k],0);
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"n/a";
const sel=t=>D.rows.filter(r=>(M=="All"||r.m==M)&&(H=="All"||r.h==H)&&(!t||r.t==t));
function btns(id,vals,cur,fn){const e=document.getElementById(id);e.innerHTML="";vals.forEach(v=>{const b=document.createElement("button");b.textContent=v;if(v==cur)b.className="on";b.onclick=()=>fn(v);e.appendChild(b)})}
function stats(t){const r=sel(t);return{g:sum(r,"g"),son:sum(r,"son"),soff:sum(r,"soff"),pf:sum(r,"pf"),ps:sum(r,"ps"),ch:sum(r,"ch"),bp:sum(r,"bp")}}
function render(){
 btns("fm",["All",...D.matches].map(v=>v=="All"?"All matches":v),M=="All"?"All matches":M,v=>{M=v=="All matches"?"All":v;render()});
 btns("fh",["Both halves","1st half","2nd half"],H=="All"?"Both halves":H=="1ST HALF"?"1st half":"2nd half",v=>{H=v=="Both halves"?"All":v.toUpperCase();render()});
 document.getElementById("sub").textContent=(M=="All"?"All matches":M)+" · "+(H=="All"?"Both halves":H.toLowerCase());
 const b=stats("BSP"),a=stats("Away Team"),tp=b.bp+a.bp,bpp=tp?b.bp/tp*100:0;
 document.getElementById("pbar").innerHTML=`<div class="b" style="width:${bpp}%">${Math.round(bpp)}%</div><div class="w" style="width:${100-bpp}%">${100-Math.round(bpp)}%</div>`;
 const acc=s=>pct(s.ps,s.ps+s.pf);
 const K=[["Goals",b.g,a.g,""],["Shots on target",b.son,a.son,""],["Shots off target",b.soff,a.soff,""],["Pass accuracy",acc(b),acc(a),""],["Chances created",b.ch,a.ch,""],["Shot conversion",pct(b.g,b.son+b.soff),pct(a.g,a.son+a.soff),"Goals ÷ total shots"],["Chances created %",pct(b.ch,b.g),pct(a.ch,a.g),"Chances created ÷ goals"]];
 document.getElementById("kpis").innerHTML=K.map(k=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="v"><span class="num">${k[1]}</span><span class="a">Away ${k[2]}</span></div><div class="s">${k[3]||"BSP vs Away Team"}</div></div>`).join("");
 draw(b,a);table();
}
function mk(id,cfg){if(charts[id])charts[id].destroy();const c=css("--ink"),l=css("--line");
 const o=cfg.options||{},sc=o.scales||{},ax=a=>Object.assign({grid:{color:l},beginAtZero:true},sc[a],{ticks:Object.assign({color:c},(sc[a]||{}).ticks)});cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:c}}}},o,{scales:{x:ax('x'),y:ax('y')}});
 if(cfg.stk){cfg.options.scales.x.stacked=cfg.options.scales.y.stacked=true}
 charts[id]=new Chart(document.getElementById(id),cfg)}
const ds=(l,d,c)=>({label:l,data:d,backgroundColor:c});
function draw(b,a){
 const ms=M=="All"?D.matches:[M],hs=H=="All"?["1ST HALF","2ND HALF"]:[H];
 const labs=[],pb=[];
 ms.forEach(m=>hs.forEach(h=>{const rb=D.rows.filter(r=>r.m==m&&r.h==h&&r.t=="BSP"),ra=D.rows.filter(r=>r.m==m&&r.h==h&&r.t!="BSP");const x=sum(rb,"bp"),y=sum(ra,"bp");labs.push(m.replace("Match ","M")+" "+(h[0]=="1"?"1st":"2nd"));pb.push(x+y?Math.round(x/(x+y)*100):0)}));
 mk("c1",{type:"bar",data:{labels:labs,datasets:[ds("BSP",pb,OR),ds("Away Team",pb.map(v=>100-v),GR())]},stk:1,options:{scales:{y:{max:100}}}});
 mk("c2",{type:"bar",data:{labels:["Goals","On target","Off target"],datasets:[ds("BSP",[b.g,b.son,b.soff],OR),ds("Away Team",[a.g,a.son,a.soff],GR())]}});
 mk("c3",{type:"bar",data:{labels:["BSP","Away Team"],datasets:[ds("Successful",[b.ps,a.ps],OR),ds("Failed",[b.pf,a.pf],"#222")]},stk:1});
 const ch=hs.map(h=>[sum(D.rows.filter(r=>(M=="All"||r.m==M)&&r.h==h&&r.t=="BSP"),"ch"),sum(D.rows.filter(r=>(M=="All"||r.m==M)&&r.h==h&&r.t!="BSP"),"ch")]);
 mk("c4",{type:"bar",data:{labels:hs.map(h=>h=="1ST HALF"?"1st half":"2nd half"),datasets:[ds("BSP",ch.map(x=>x[0]),OR),ds("Away Team",ch.map(x=>x[1]),GR())]},options:{scales:{y:{ticks:{precision:0}}}}});
}
function table(){
 const g={};D.rows.forEach(r=>{const k=r.m+"|"+r.t+"|"+r.h;g[k]=g[k]||{m:r.m,t:r.t,h:r.h,g:0,son:0,soff:0,pf:0,ps:0,ch:0,bp:0};["g","son","soff","pf","ps","ch","bp"].forEach(f=>g[k][f]+=r[f])});
 let rows=Object.values(g);rows.forEach(r=>{const o=rows.filter(x=>x.m==r.m&&x.h==r.h);r.pos=sum(o,"bp")?r.bp/sum(o,"bp")*100:0;r.acc=r.ps+r.pf?r.ps/(r.ps+r.pf)*100:null;r.conv=r.son+r.soff?r.g/(r.son+r.soff)*100:null;r.cc=r.g?r.ch/r.g*100:null});
 if(sortK)rows.sort((x,y)=>(((x[sortK]??-1)>(y[sortK]??-1))?1:-1)*(asc?1:-1));
 const C=[["Match","m"],["Team","t"],["Half","h"],["Poss %","pos"],["Goals","g"],["On tgt","son"],["Off tgt","soff"],["Pass ok","ps"],["Pass fail","pf"],["Pass acc %","acc"],["Chances","ch"],["Conv %","conv"],["Chance %","cc"]];
 const f=v=>v==null?"n/a":Math.round(v);
 const t=document.getElementById("tb");
 t.innerHTML="<thead><tr>"+C.map(c=>`<th data-k="${c[1]}">${c[0]}</th>`).join("")+"</tr></thead><tbody>"+rows.map(r=>`<tr class="${r.t=="BSP"?"bsp":""}"><td>${r.m}</td><td>${r.t}</td><td>${r.h=="1ST HALF"?"1st":"2nd"}</td><td>${f(r.pos)}</td><td>${r.g}</td><td>${r.son}</td><td>${r.soff}</td><td>${r.ps}</td><td>${r.pf}</td><td>${f(r.acc)}</td><td>${r.ch}</td><td>${f(r.conv)}</td><td>${f(r.cc)}</td></tr>`).join("")+"</tbody>";
 t.querySelectorAll("th").forEach(h=>h.onclick=()=>{const k=h.dataset.k;asc=sortK==k?!asc:true;sortK=k;table()});
}
document.getElementById("notes").innerHTML=D.notes.map(n=>"<li>"+n+"</li>").join("");
render();
</script>
<script>
(async()=>{const SAMPLE=JSON.parse(JSON.stringify(D));const $=i=>document.getElementById(i);const msg=t=>{$('upmsg').textContent=t};const REQ=['TEAM','MATCH','1ST/2ND HALF','Row','Duration','GOALS','SHOTS_ON_TARGET','SHOTS_OFF_TARGET','PASSES_FAIL','PASSES_SUCCESSFUL','CHANCES CREATED'];const num=v=>Number(v)||0;const cl=s=>String(s==null?'':s).replace(/[<>&]/g,'').trim();
let ref=null;
function build(text){const p=Papa.parse(text.charCodeAt(0)===65279?text.slice(1):text,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});const miss=REQ.filter(c=>!(p.meta.fields||[]).includes(c));if(miss.length)throw new Error('Missing columns: '+miss.join(', '));const g={};let blank=0;
p.data.forEach(r=>{const t=cl(r.TEAM);if(!t){blank++;return}const tm=t==='BSP'?'BSP':'Away Team',m=cl(r.MATCH),h=cl(r['1ST/2ND HALF']).toUpperCase(),k=m+'|'+tm+'|'+h;const o=g[k]=g[k]||{m,t:tm,h,g:0,son:0,soff:0,pf:0,ps:0,ch:0,bp:0};o.g+=num(r.GOALS);o.son+=num(r.SHOTS_ON_TARGET);o.soff+=num(r.SHOTS_OFF_TARGET);o.pf+=num(r.PASSES_FAIL);o.ps+=num(r.PASSES_SUCCESSFUL);o.ch+=num(r['CHANCES CREATED']);if(r.Row==='Home BP'||r.Row==='Away BP')o.bp+=num(r.Duration)});
const rows=Object.values(g);if(!rows.some(r=>r.t==='BSP'))throw new Error('No rows found for team BSP');const T=k=>rows.reduce((s,r)=>s+r[k],0);
const notes=['Possession % uses Home BP and Away BP durations only (other rows overlap them). The two teams total 100%.',blank+' kick-off/unassigned rows (no team) were excluded.','Shot conversion is goals ÷ (shots on target + shots off target); chances created % is chances created ÷ goals. Both show n/a when the denominator is 0. All percentages are rounded to whole numbers.'];
if(T('g')>0&&T('g')===T('son'))notes.push('Data flag: goals equal shots on target in total, which may be a tagging overlap worth checking.');if(!rows.some(r=>r.t!=='BSP'&&r.g>0))notes.push('Data flag: the Away Team has no goals, so its chances created % shows n/a.');
return{matches:[...new Set(rows.map(r=>r.m))].sort(),rows,notes}}
const clean=d=>({matches:d.matches.map(cl),rows:d.rows.map(r=>({m:cl(r.m),t:r.t==='BSP'?'BSP':'Away Team',h:cl(r.h),g:num(r.g),son:num(r.son),soff:num(r.soff),pf:num(r.pf),ps:num(r.ps),ch:num(r.ch),bp:num(r.bp)})),notes:d.notes.map(cl)});
function apply(d){D=clean(d);M='All';H='All';$('notes').innerHTML=D.notes.map(x=>'<li>'+x+'</li>').join('');render()}
async function save(d){let ok=false;try{if(ref){await ref.set({json:JSON.stringify(d),updated:new Date().toISOString()});ok=true}}catch(e){}try{localStorage.setItem('bsp_report',JSON.stringify(d))}catch(e){}return ok}
let loaded=false;try{if(ref){const s=await ref.get();if(s.exists){apply(JSON.parse(s.data().json));loaded=true;msg('Showing the latest shared data. Upload a new CSV to update it.')}}}catch(e){}
if(!loaded){try{const l=localStorage.getItem('bsp_report');if(l){apply(JSON.parse(l));msg('Showing data saved on this device. Upload a new CSV to update it.')}}catch(e){}}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=build(await f.text());apply(d);msg('Loaded '+f.name+': '+d.matches.length+' match(es). Saving...');const ok=await save(d);msg('Loaded '+f.name+': '+d.matches.length+' match(es). '+'Your file is processed in your browser and saved on this device only.')}catch(err){msg('Could not read that file. '+err.message)}e.target.value=''};
$('reset').onclick=async()=>{apply(SAMPLE);const ok=await save(SAMPLE);msg('Showing the sample data.')};
$('lbl').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
})();
</script></body></html>
